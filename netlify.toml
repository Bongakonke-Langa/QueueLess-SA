[build]
  # Static Next.js build only. Database migrations and seeding are not run
  # during the hosted build because production deploys should not assume a
  # writable direct Postgres connection is available in the build sandbox.
  #
  # If you do run migrations in CI, set BOTH of these in Netlify environment
  # variables (Site configuration -> Environment variables):
  #   DATABASE_URL  — pooled app connection used by the API at runtime
  #   DIRECT_URL    — direct (non-pooler) connection used only by Prisma migrations
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The database is hosted (Neon/Supabase), so nothing here needs a local disk.
# Set DATABASE_URL, DIRECT_URL and NEXT_PUBLIC_DEMO_MODE in the Netlify UI:
#   Site configuration -> Environment variables
